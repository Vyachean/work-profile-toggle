name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up CI debug keystore
        run: |
          keystore_path="$RUNNER_TEMP/work-profile-toggle-debug.keystore"
          tr -d '\r\n[:space:]' < .github/ci-debug.keystore.base64 | base64 --decode > "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass android \
            -alias AndroidDebugKey >/dev/null
          echo "CI_DEBUG_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Check project
        run: sh ./gradlew -PciDebugKeystorePath="$CI_DEBUG_KEYSTORE_PATH" lint test assembleDebug assembleRelease

      - name: Verify debug APK signing certificate
        run: |
          expected_sha256="5f49f7e574cac855329af8151a480f4757615e5b28afae1372e7991a5215cb77"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner was not found under $ANDROID_HOME/build-tools" >&2
            exit 1
          fi

          certs="$($apksigner_path verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$certs"
          actual_sha256="$(printf '%s\n' "$certs" | sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' | head -n 1)"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "Unexpected debug APK signing certificate SHA-256: $actual_sha256" >&2
            echo "Expected: $expected_sha256" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: work-profile-toggle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
