name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up CI debug keystore
        run: |
          keystore_path="$RUNNER_TEMP/work-profile-toggle-debug.keystore"
          tr -d '\r\n[:space:]' < .github/ci-debug.keystore.base64 | base64 --decode > "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass android \
            -alias AndroidDebugKey >/dev/null
          echo "CI_DEBUG_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Check project
        run: sh ./gradlew -PciDebugKeystorePath="$CI_DEBUG_KEYSTORE_PATH" lint test assembleDebug assembleRelease

      - name: Verify debug APK signing certificate
        run: |
          expected_sha256="5f49f7e574cac855329af8151a480f4757615e5b28afae1372e7991a5215cb77"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner was not found under $ANDROID_HOME/build-tools" >&2
            exit 1
          fi

          certs="$($apksigner_path verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$certs"
          actual_sha256="$(printf '%s\n' "$certs" | sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' | head -n 1)"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "Unexpected debug APK signing certificate SHA-256: $actual_sha256" >&2
            echo "Expected: $expected_sha256" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: work-profile-toggle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  compose-screenshot-poc:
    name: Compose screenshot POC
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Render twice and compare
        shell: bash
        run: |
          set -euo pipefail

          reference_dir="app/src/screenshotTestDebug/reference"
          first_dir="$RUNNER_TEMP/compose-screenshot-first"
          artifact_dir="$GITHUB_WORKSPACE/compose-screenshot-artifacts"
          first_hashes="$RUNNER_TEMP/compose-screenshot-first.sha256"
          second_hashes="$RUNNER_TEMP/compose-screenshot-second.sha256"

          rm -rf "$reference_dir" "$first_dir" "$artifact_dir"

          sh ./gradlew :app:updateDebugScreenshotTest --rerun-tasks --no-build-cache

          if ! find "$reference_dir" -type f -name '*.png' -print -quit | grep -q .; then
            echo "The first screenshot render produced no PNG files." >&2
            exit 1
          fi

          mkdir -p "$first_dir"
          cp -R "$reference_dir"/. "$first_dir"/
          (
            cd "$reference_dir"
            find . -type f -name '*.png' -print0 | sort -z | xargs -0 sha256sum
          ) > "$first_hashes"

          rm -rf "$reference_dir"
          sh ./gradlew :app:updateDebugScreenshotTest --rerun-tasks --no-build-cache

          if ! find "$reference_dir" -type f -name '*.png' -print -quit | grep -q .; then
            echo "The second screenshot render produced no PNG files." >&2
            exit 1
          fi

          (
            cd "$reference_dir"
            find . -type f -name '*.png' -print0 | sort -z | xargs -0 sha256sum
          ) > "$second_hashes"

          diff -u "$first_hashes" "$second_hashes"

          mkdir -p "$artifact_dir/first" "$artifact_dir/second"
          cp -R "$first_dir"/. "$artifact_dir/first"/
          cp -R "$reference_dir"/. "$artifact_dir/second"/
          cp "$first_hashes" "$artifact_dir/first.sha256"
          cp "$second_hashes" "$artifact_dir/second.sha256"

      - name: Upload screenshot POC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-screenshot-poc
          path: |
            compose-screenshot-artifacts/
            app/build/reports/screenshotTest/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
