name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up CI debug keystore
        run: |
          mkdir -p "$HOME/.android"
          tr -d '\r\n[:space:]' < .github/ci-debug.keystore.base64 | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias AndroidDebugKey >/dev/null

      - name: Check project
        run: sh ./gradlew lint test assembleDebug

      - name: Verify debug APK signing certificate
        run: |
          expected_sha256="5464ec657871d3a209daa118cf2b14e688052f7bd018c33d6a12ecfd574313ac"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner was not found under $ANDROID_HOME/build-tools" >&2
            exit 1
          fi

          certs="$($apksigner_path verify --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          printf '%s\n' "$certs"
          actual_sha256="$(printf '%s\n' "$certs" | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "Unexpected debug APK signing certificate SHA-256: $actual_sha256" >&2
            echo "Expected: $expected_sha256" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: work-profile-toggle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
