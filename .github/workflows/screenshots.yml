name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/screenshots.yml'
      - 'app/**'
      - 'README.md'
      - 'docs/screenshots/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/screenshots.yml'
      - 'app/**'
      - 'README.md'
      - 'docs/screenshots/**'

permissions:
  contents: read

jobs:
  android-screenshots:
    name: Android screenshots
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up CI debug keystore
        run: |
          keystore_path="$RUNNER_TEMP/work-profile-toggle-debug.keystore"
          tr -d '\r\n[:space:]' < .github/ci-debug.keystore.base64 | base64 --decode > "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass android \
            -alias AndroidDebugKey >/dev/null
          echo "CI_DEBUG_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: sh ./gradlew -PciDebugKeystorePath="$CI_DEBUG_KEYSTORE_PATH" assembleDebug

      - name: Prepare screenshot artifact directories
        run: |
          mkdir -p build/screenshots build/screenshot-diagnostics
          {
            echo "workflow=Screenshots"
            echo "runner=${RUNNER_OS}"
            echo "sha=${GITHUB_SHA}"
          } > build/screenshot-diagnostics/workflow.txt

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -u
            status=0
            package_name="io.github.vyachean.workprofiletoggle"
            screenshots_dir="build/screenshots"
            diagnostics_dir="build/screenshot-diagnostics"
            mkdir -p "$screenshots_dir" "$diagnostics_dir"

            adb devices -l | tee "$diagnostics_dir/devices.txt" || true
            adb shell getprop > "$diagnostics_dir/getprop.txt" || true

            adb install -r app/build/outputs/apk/debug/app-debug.apk || status=1

            if [ "$status" -eq 0 ]; then
              adb shell am force-stop "$package_name" || true
              adb shell monkey -p "$package_name" 1 || status=1
              sleep 5
              adb exec-out screencap -p > "$screenshots_dir/home.png" || status=1
            fi

            if [ "$status" -eq 0 ]; then
              adb shell input swipe 540 1900 540 800 500 || true
              sleep 1
              adb exec-out screencap -p > "$screenshots_dir/home-scrolled.png" || status=1
            fi

            if adb shell am start -W -a android.intent.action.CREATE_SHORTCUT -n "$package_name/.LegacyShortcutPickerActivity"; then
              sleep 2
              adb exec-out screencap -p > "$screenshots_dir/legacy-shortcut-picker.png" || true
            fi

            adb shell dumpsys window > "$diagnostics_dir/window.txt" || true
            adb shell dumpsys activity activities > "$diagnostics_dir/activities.txt" || true
            adb logcat -d > "$diagnostics_dir/logcat.txt" || true

            exit "$status"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-profile-toggle-screenshots
          path: |
            build/screenshots/*.png
            build/screenshot-diagnostics/*.txt
          if-no-files-found: warn
