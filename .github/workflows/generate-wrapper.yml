name: Generate Gradle Wrapper

on:
  push:
    branches:
      - bootstrap/android-project

permissions:
  contents: write

jobs:
  generate-wrapper:
    name: Generate official Gradle Wrapper
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate official Gradle Wrapper
        run: |
          sh ./gradlew wrapper --gradle-version 9.4.1 --distribution-type bin
          ./gradlew wrapper --gradle-version 9.4.1 --distribution-type bin

      - name: Verify project with generated wrapper
        run: ./gradlew lint test assembleDebug

      - name: Remove temporary workflow
        run: rm .github/workflows/generate-wrapper.yml

      - name: Commit generated wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties .github/workflows/generate-wrapper.yml
          git commit -m "Generate Gradle wrapper"
          git push
