name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$DISPATCH_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if ! printf '%s\n' "$release_tag" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Release tag must look like v0.1.0 or v0.1.0-rc.1: $release_tag" >&2
            exit 1
          fi

          git fetch --tags --force
          if ! git rev-parse --verify --quiet "refs/tags/$release_tag^{commit}" >/dev/null; then
            echo "Release tag does not exist: $release_tag" >&2
            exit 1
          fi

          git checkout --detach "$release_tag"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Validate release version
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"

          if [ -z "$version_name" ]; then
            echo "Could not read versionName from app/build.gradle.kts." >&2
            exit 1
          fi
          if [ -z "$version_code" ]; then
            echo "Could not read versionCode from app/build.gradle.kts." >&2
            exit 1
          fi

          expected_tag="v$version_name"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag must match versionName." >&2
            echo "Expected: $expected_tag" >&2
            echo "Actual:   $RELEASE_TAG" >&2
            exit 1
          fi

          echo "Release versionName=$version_name versionCode=$version_code tag=$RELEASE_TAG"

      - name: Set up JDK
        uses: actions/setup-java@v4.8.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is required." >&2
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/work-profile-toggle-release.keystore"
          normalized_keystore_base64="$(printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n[:space:]')"
          printf '%s' "$normalized_keystore_base64" | base64 --decode > "$keystore_path"
          echo "RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_PATH" ]; then
            echo "RELEASE_KEYSTORE_PATH is required." >&2
            exit 1
          fi
          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "RELEASE_KEYSTORE_PASSWORD is required." >&2
            exit 1
          fi
          if [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "RELEASE_KEY_ALIAS is required." >&2
            exit 1
          fi
          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "RELEASE_KEY_PASSWORD is required." >&2
            exit 1
          fi

          sh ./gradlew \
            -PreleaseKeystorePath="$RELEASE_KEYSTORE_PATH" \
            -PreleaseKeystorePassword="$RELEASE_KEYSTORE_PASSWORD" \
            -PreleaseKeyAlias="$RELEASE_KEY_ALIAS" \
            -PreleaseKeyPassword="$RELEASE_KEY_PASSWORD" \
            lint test assembleRelease

      - name: Verify release APK
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "apksigner was not found under $ANDROID_HOME/build-tools" >&2
            exit 1
          fi

          certs="$($apksigner_path verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          printf '%s\n' "$certs"

          if [ -n "$RELEASE_CERT_SHA256" ]; then
            expected_sha256="$(printf '%s' "$RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')"
            actual_sha256="$(printf '%s\n' "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p; s/^V[0-9].*Signer: certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]:')"

            if [ -z "$actual_sha256" ]; then
              echo "Could not read release APK signing certificate SHA-256." >&2
              exit 1
            fi
            if [ "$actual_sha256" != "$expected_sha256" ]; then
              echo "Unexpected release APK signing certificate SHA-256: $actual_sha256" >&2
              echo "Expected: $expected_sha256" >&2
              exit 1
            fi
          else
            echo "RELEASE_CERT_SHA256 is not configured; skipping fixed release certificate fingerprint check."
          fi

      - name: Rename release APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/work-profile-toggle-${RELEASE_TAG}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-profile-toggle-release-apk
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-artifacts/*.apk \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
