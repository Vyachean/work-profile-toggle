name: Feature request
description: Propose a scoped product change
title: "Feature: "
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This stays within quiet-mode launcher shortcuts.
          required: true
        - label: This does not add scheduling, automation, telemetry, or profile-management features.
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
